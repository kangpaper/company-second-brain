[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "company-second-brain"
version = "0.1.0"
description = "Business context and organizational memory platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "uvicorn[standard]>=0.34,<1",
  "PyYAML>=6.0,<7",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "pymupdf>=1.25,<2",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest-asyncio>=0.25,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/company_brain"]

[tool.pytest.ini_options]
pythonpath = [".", "apps/api/src"]
testpaths = ["apps/api/tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = ["postgres: requires a migrated PostgreSQL test database"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["apps/api/src", "apps/api/tests"]
extend-exclude = ["apps/api/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["company_brain"]
mypy_path = "apps/api/src"
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "types-openpyxl>=3.1,<4",
]
